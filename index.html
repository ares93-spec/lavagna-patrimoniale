<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#003781">
<meta name="robots" content="noindex, nofollow">
<title>Lavagna Patrimoniale</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone/icona-192.png">
<link rel="apple-touch-icon" href="icone/icona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- SCHERMO PIN -->
<main id="schermo-pin" class="schermo centro" hidden>
  <form id="modulo-pin" class="carta" autocomplete="off">
    <div class="marchio"><span class="filo-oro"></span>Lavagna Patrimoniale</div>
    <h1 id="pin-titolo">Sblocca l'archivio</h1>
    <p id="pin-testo" class="nota"></p>
    <label for="pin-1">PIN</label>
    <input id="pin-1" type="password" inputmode="numeric" autocomplete="off" required>
    <div id="pin-conferma">
      <label for="pin-2">Ripeti il PIN</label>
      <input id="pin-2" type="password" inputmode="numeric" autocomplete="off">
    </div>
    <p id="pin-errore" class="errore" role="alert"></p>
    <button id="pin-invia" class="primario" type="submit">Sblocca</button>
    <button id="pin-ripristina" class="testo" type="button">Ripristina da un file di backup</button>
    <button id="pin-azzera" class="testo pericolo" type="button">PIN dimenticato</button>
  </form>
</main>

<!-- SCHERMO ELENCO MAPPE -->
<main id="schermo-elenco" class="schermo" hidden>
  <header class="barra">
    <div class="marchio"><span class="filo-oro"></span>Lavagna Patrimoniale</div>
    <button id="btn-blocca" class="su-blu" type="button">Blocca</button>
  </header>
  <section class="contenuto">
    <div class="riga-azioni">
      <button id="btn-nuova" class="primario" type="button">+ Nuova mappa</button>
      <button id="btn-backup" type="button">Salva backup</button>
      <button id="btn-ripristina" type="button">Ripristina</button>
    </div>
    <p id="elenco-vuoto" class="nota" hidden>Nessuna mappa. Creane una per iniziare.</p>
    <ul id="elenco-mappe" class="elenco"></ul>
    <p class="nota piede">I dati restano solo su questo dispositivo, cifrati con il tuo PIN. Usa iniziali e cifre arrotondate. <span id="versione"></span></p>
  </section>
</main>

<!-- SCHERMO TELA -->
<main id="schermo-tela" class="schermo tela" hidden>
  <header class="barra">
    <button id="btn-indietro" class="su-blu" type="button" aria-label="Torna alle mappe">&#8592;<span class="etichetta"> Mappe</span></button>
    <button id="btn-titolo" class="su-blu titolo" type="button"></button>
    <span id="stato-salvataggio" class="stato" aria-live="polite"></span>
    <button id="btn-annulla" class="su-blu icona" type="button" aria-label="Annulla">&#8630;</button>
    <button id="btn-ripeti" class="su-blu icona" type="button" aria-label="Ripristina">&#8631;</button>
    <button id="btn-menu" class="su-blu icona" type="button" aria-label="Altre azioni">&#8943;</button>
  </header>
  <div id="menu-tela" class="menu" hidden>
    <button id="btn-adatta" type="button">Adatta allo schermo</button>
    <button id="btn-dito" type="button" aria-pressed="false">Disegna con il dito: no</button>
    <button id="btn-stampa" type="button">Stampa</button>
  </div>
  <canvas id="tela"></canvas>
  <footer class="attrezzi">
    <div id="colori" class="gruppo" role="group" aria-label="Colore"></div>
    <div id="spessori" class="gruppo" role="group" aria-label="Spessore"></div>
    <button id="btn-gomma" type="button" class="attrezzo" aria-pressed="false">Gomma</button>
  </footer>
</main>

<!-- FINESTRA DI DIALOGO -->
<dialog id="dialogo">
  <form method="dialog" id="dialogo-modulo">
    <h2 id="dialogo-titolo"></h2>
    <p id="dialogo-testo"></p>
    <input id="dialogo-campo" type="text" autocomplete="off">
    <div class="riga-azioni fine">
      <button id="dialogo-no" type="button">Annulla</button>
      <button id="dialogo-si" class="primario" type="submit">OK</button>
    </div>
  </form>
</dialog>

<!-- AREA DI STAMPA -->
<div id="stampa" aria-hidden="true"></div>
<input id="file-backup" type="file" accept=".json,.lavagna,application/json" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
